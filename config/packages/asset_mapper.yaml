framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Tailwind CLI's build *input* — its `@import "tailwindcss"` isn't a
        # real relative file, so AssetMapper can't resolve it. Only the
        # compiled assets/styles/app.css is ever actually served.
        excluded_patterns:
            - '*/assets/styles/src.css'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
