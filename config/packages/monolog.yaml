monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - performance
        - security
        - business

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # Logs de sécurité séparés
            security:
                type: stream
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: ["security"]
when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!deprecation", "!security", "!business", "!performance"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # rotating_file (not stream): unlike security/business/performance
            # below, this used to grow forever — no cap, nothing ever removes
            # old entries, on shared hosting with a limited disk quota.
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 30
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # rotating_file, not stream, for the same reason as `nested` above
            # — deprecations.log is high-volume (every deprecated call, every
            # request/cron tick) and was growing unbounded.
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecations.log"
                max_files: 7
                formatter: monolog.formatter.json

            # Logs de sécurité avec rotation séparée
            security:
                type: rotating_file
                path: "%kernel.logs_dir%/security.log"
                level: info
                max_files: 30
                channels: ["security"]

            # Logs business/métier avec rotation
            business:
                type: rotating_file
                path: "%kernel.logs_dir%/business.log"
                level: info
                max_files: 15
                channels: ["business"]

            # Logs de performance
            performance:
                type: rotating_file
                path: "%kernel.logs_dir%/performance.log"
                level: info
                max_files: 7
                channels: ["performance"]

            # Wraps error_mailer below so a transient failure sending the alert
            # itself (e.g. the SMTP relay timing out) can never crash whatever
            # request/command triggered the log — WhatFailureGroupHandler
            # swallows any exception thrown by its members instead of letting
            # it propagate. Hit this in production: a Hostinger SMTP timeout
            # while delivering an error-alert email crashed schedule:run and
            # took a scheduled task down with it. Same "never take down the
            # caller" rule NotificationSender already applies to in-app alert
            # delivery (see CLAUDE.md's Alerting section).
            error_alerts:
                type: whatfailuregroup
                members: [error_mailer]
                channels: ["!deprecation", "!event"]

            # Alertes ERROR -> ADMIN + SUPER_ADMIN (nested inside error_alerts above)
            error_mailer:
                type: fingers_crossed
                action_level: error
                handler: error_swift
                buffer_size: 50
                stop_buffering: false
                excluded_http_codes: [404, 405, 410]

            # native_mailer would silently ignore `mailer:` and send through
            # PHP's mail() instead of the error_mailer SMTP transport below —
            # symfony_mailer is the handler type that actually honors it.
            error_swift:
                type: symfony_mailer
                to_email: '%env(ADMIN_ALERT_EMAIL)%'
                from_email: '%env(MAILER_ERRORS_FROM)%'
                subject: '[ERROR] Application Error'
                level: error
                formatter: monolog.formatter.html
                content_type: text/html
                mailer: 'error_mailer'
