parameters:
    geoip.default_db_path: '%kernel.project_dir%/var/geoip/GeoLite2-City.mmdb'
    app_name: '%env(APP_NAME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Infrastructure\Security\OpenSslPasswordEncryptor:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    App\Domain\Service\PasswordEncryptorInterface:
        alias: App\Infrastructure\Security\OpenSslPasswordEncryptor

    App\Domain\Repository\MonitorRepositoryInterface:
        class: App\Infrastructure\Persistence\Repository\CachedMonitorRepository
        arguments:
            $delegate: '@App\Infrastructure\Persistence\Repository\DoctrineMonitorRepository'

    App\Domain\Service\ImapReaderInterface:
        class: App\Infrastructure\Imap\ImapReader
        arguments:
            $host: '%env(IMAP_HOST)%'
            $port: '%env(int:IMAP_PORT)%'
            $username: '%env(IMAP_USERNAME)%'
            $password: '%env(IMAP_PASSWORD)%'
            $secure: '%env(IMAP_SECURE)%'

    App\Infrastructure\Mailer\SmtpTester:
        arguments:
            $testEmailRecipient: '%env(SITETRACK_TEST_EMAIL)%'

    App\Domain\Service\PasswordHasherInterface:
        alias: App\Infrastructure\Security\SymfonyPasswordHasher

    App\Infrastructure\GeoIp\MaxMindGeoIpResolver:
        arguments:
            $dbPath: '%env(default:geoip.default_db_path:GEOIP_DB_PATH)%'

    App\Domain\Service\GeoIpResolverInterface:
        alias: App\Infrastructure\GeoIp\MaxMindGeoIpResolver

    App\Domain\Service\UserAgentParserInterface:
        alias: App\Infrastructure\Http\UaParserUserAgentParser

    App\Domain\Service\PdfRendererInterface:
        alias: App\Infrastructure\Reporting\DompdfRenderer


    # Mailer pour les alertes d'erreurs (séparé du mailer principal)
    error_mailer:
        class: Symfony\Component\Mailer\Mailer
        arguments:
            - '@error_mailer.transport'

    error_mailer.transport:
        class: Symfony\Component\Mailer\Transport\Smtp\EsmtpTransport
        factory: [ '@mailer.transport_factory', 'fromString' ]
        arguments:
            - '%env(MAILER_DSN_ERRORS)%'

    # Compte les requêtes SQL de la requête HTTP courante (PerformanceSubscriber) —
    # Doctrine\DBAL\Logging\Middleware appelle QueryCounter::log() une fois par
    # requête SQL ; auto-tagué "doctrine.middleware" par DoctrineBundle
    # (registerForAutoconfiguration sur Middleware) et donc appliqué à la
    # connexion par défaut sans configuration supplémentaire dans doctrine.yaml.
    Doctrine\DBAL\Logging\Middleware:
        arguments:
            $logger: '@App\Infrastructure\Monitoring\QueryCounter'

    # Monitoring - ErrorMonitoringSubscriber avec loggers spécifiques
    App\Infrastructure\Monitoring\ErrorMonitoringSubscriber:
        arguments:
            $logger: '@monolog.logger'
            $securityLogger: '@monolog.logger.security'
            $businessLogger: '@monolog.logger.business'
            $security: '@security.helper'
            $environment: '%kernel.environment%'

    App\Infrastructure\Monitoring\PerformanceSubscriber:
        arguments:
            $performanceLogger: '@monolog.logger.performance'
            $security: '@security.helper'
            $debug: '%kernel.debug%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

